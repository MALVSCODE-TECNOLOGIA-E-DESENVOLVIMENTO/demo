<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MALVSCODE · Portal</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <!-- ═══════════════════════════════════════════ -->
  <!-- TELA DE LOGIN                               -->
  <!-- ═══════════════════════════════════════════ -->
  <div id="loginScreen" class="login-screen">
    <!-- Linhas decorativas animadas -->
    <div class="login-line login-line-h"></div>
    <div class="login-line login-line-h"></div>
    <div class="login-line login-line-h"></div>
    <div class="login-line login-line-v"></div>
    <div class="login-line login-line-v"></div>
    <div class="login-line login-line-v"></div>

    <div class="login-card">
      <div class="login-form-area">
        <div id="messageBox" class="message"></div>

        <!-- Logo -->
        <div class="login-logo-wrapper">
          <div class="login-logo-mark">M</div>
        </div>

        <div class="login-portal-sub">MALVSCODE</div>
        <div class="login-portal-headline">IDENTIFIQUE-SE PARA CONTINUAR</div>

        <div class="login-fields">
          <form id="loginForm">
            <div class="form-group">
              <label for="username">Usuário</label>
              <div class="input-icon-wrapper">
                <span class="input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <circle cx="12" cy="8" r="4"/>
                    <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
                  </svg>
                </span>
                <input type="text" id="username" name="username" required autofocus
                       placeholder="Digite seu usuário" autocomplete="username"
                       style="padding-left:2.6rem;" />
              </div>
            </div>

            <div class="form-group">
              <label for="password">Senha</label>
              <div class="password-container input-icon-wrapper">
                <span class="input-icon">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                  </svg>
                </span>
                <input type="password" id="password" name="password" required
                       placeholder="Digite sua senha" autocomplete="current-password"
                       style="padding-left:2.6rem;" />
                <button type="button" class="toggle-password" onclick="togglePassword()">MOSTRAR</button>
              </div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">ENTRAR</button>
          </form>
        </div>
      </div>
    </div>

    <div class="login-version-footer">
      © 2026 MALVSCODE &nbsp;·&nbsp; USO INTERNO
    </div>
  </div>

  <!-- ═══════════════════════════════════════════ -->
  <!-- SPLASH DE BOAS-VINDAS                       -->
  <!-- ═══════════════════════════════════════════ -->
  <div id="splashWelcome" class="splash-welcome">
    <div class="splash-greeting" id="splashGreeting"></div>
    <div class="splash-spinner"></div>
  </div>

  <!-- ═══════════════════════════════════════════ -->
  <!-- INTERFACE CENTRAL — SELEÇÃO DE PROJETOS     -->
  <!-- ═══════════════════════════════════════════ -->
  <div id="hubScreen" class="hub-screen">
    <header class="hub-header">
      <div class="hub-brand">
        <div class="hub-brand-mark">M</div>
        <div class="hub-brand-text">
          <span class="hub-brand-name">MALVSCODE</span>
          <span class="hub-brand-sub">PROJETOS DEMONSTRATIVOS</span>
        </div>
      </div>

      <div class="hub-user">
        <div class="hub-user-info">
          <span class="hub-user-name" id="hubUserName"></span>
          <span class="hub-user-sector" id="hubUserSector"></span>
        </div>
        <div class="hub-user-avatar" id="hubUserInitial"></div>
        <button class="hub-logout" onclick="showLogoutModal()" title="Sair">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="hub-main">
      <div class="hub-intro">
        <h1 class="hub-title" id="hubTitle">Selecione um projeto</h1>
        <p class="hub-subtitle">Escolha um dos sistemas demonstrativos abaixo para visualizar.</p>
      </div>

      <div class="hub-grid" id="hubGrid">
        <!-- Blocos gerados via JS -->
      </div>
    </main>

    <footer class="hub-footer">
      © 2026 MALVSCODE &nbsp;·&nbsp; SISTEMAS DEMONSTRATIVOS
    </footer>
  </div>

  <!-- ═══════════════════════════════════════════ -->
  <!-- MODAL DE LOGOUT                             -->
  <!-- ═══════════════════════════════════════════ -->
  <div class="modal-overlay" id="logoutModal">
    <div class="modal-content">
      <button class="close-modal" onclick="closeLogoutModal()">✕</button>
      <div class="modal-message-logout">Deseja realmente sair?</div>
      <div class="modal-actions">
        <button type="button" onclick="confirmLogout()" class="danger">Sim</button>
        <button type="button" onclick="closeLogoutModal()" class="secondary">Cancelar</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
